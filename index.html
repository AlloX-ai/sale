<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="/favicon.svg" />
    <link
      rel="stylesheet"
      type="text/css"
      charset="UTF-8"
      href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick-theme.min.css"
    />
    <meta
      name="description"
      content="AI-powered capital allocation platform that transforms market narratives into diversified, risk-managed portfolios."
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      property="og:image"
      content="https://cdn.allox.ai/allox/AlloX-mobile.svg"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AlloX" />
    <meta property="og:title" content="AlloX" />
    <meta
      property="og:description"
      content="AI-powered capital allocation platform that transforms market narratives into diversified, risk-managed portfolios."
    />
    <meta property="og:url" content="https://app.allox.ai/" />
    <meta property="og:image:alt" content="AlloX platform preview" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>AlloX Sale</title>
    <script>
      // Apply the saved theme before first paint (light is the default). Key matches src/hooks/useTheme.js
      try {
        if (localStorage.getItem("allox-theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
    <script type="module">
      import { Buffer } from "buffer";
      import process from "process";
      window.Buffer = Buffer;
      window.process = process;
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
